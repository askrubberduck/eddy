name: Release

on:
  push:
    tags: ['v*']

# Only the publish job receives an OIDC identity.
permissions:
  contents: read

jobs:
  # The executable example, the artifact compile at the consumer TypeScript floor, and the React 19
  # suite. `ci.yml` calls the same file, so a tag and a push are held to one copy of these steps
  # instead of two that can drift apart.
  release-gate:
    uses: ./.github/workflows/release-gate.yml

  build:
    needs: release-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Reject a tag that does not match the manifest version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version ($expected)"
            exit 1
          fi

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      # After setup-node, not before: run earlier and this audits on whatever npm the runner image
      # happens to ship rather than the version the release is built with.
      - run: npm audit --audit-level=high

      # Install hooks are a supply-chain surface; the next line runs the build explicitly.
      - run: npm ci --ignore-scripts
      - run: npm run prepublishOnly

      - run: npm test
      - name: Reject repository-only references in the built artifact
        run: |
          if grep -rnIE '(test/[A-Za-z.-]+\.spec\.tsx?|wiki/[A-Za-z_/-]+\.md|examples/)' output README.md; then
            echo "::error::the tarball names a file it does not ship — a consumer cannot resolve it"
            exit 1
          fi

      - name: Reject internal references
        run: |
          if git grep -nIE '/Users/|/home/[a-z]|~/(code|Documents|Desktop)' -- src README.md; then
            echo "::error::a local path leaked into a public repository"
            exit 1
          fi
          # `wiki` is in scope for the same reason `src` is, and with more force: it is the
          # specification a consumer reads, and it is published to the GitHub wiki. One of these did
          # reach it.
          if git grep -nIwE '[A-E][0-9]{1,3}' -- src wiki; then
            echo "::error::an internal finding identifier (e.g. D26) leaked into shipped code or the wiki — these name private review notes that consumers cannot resolve"
            exit 1
          fi
      - run: npm run check:format
      - run: npm run check:wiki-anchors
      - run: npm run check:circular
      - run: npm run check:examples
      - run: npm run check:bundler

      - run: |
          mkdir -p release
          npm pack --ignore-scripts --pack-destination release

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package-${{ github.sha }}
          path: release/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Required reviewers for this environment are set in the repository settings, not here.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # OIDC, for trusted publishing. Provenance stays off: `publishConfig.provenance` is false.
    steps:
      # Trusted publishing requires npm 11.5.1 or newer.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package-${{ github.sha }}
          path: release

      - name: Reject a tarball that does not match the tag
        run: |
          tarball=$(ls release/*.tgz)
          tar -xzOf "$tarball" package/package.json > manifest.json
          expected="v$(node -p "require('./manifest.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::tarball version ($expected) does not match tag $GITHUB_REF_NAME"
            exit 1
          fi

      # Suppress prepublishOnly: rebuilding here would delete the downloaded artifact.
      - run: npm publish --ignore-scripts "$(ls release/*.tgz)"
