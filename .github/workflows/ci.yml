name: CI

on:
  push:
    branches: [main]
  pull_request:

# No job here writes anything: no artifact, no OIDC, no comment. The floor is the requirement.
permissions:
  contents: read

jobs:
  no-internal-refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Reject internal references
        run: |
          if git grep -nIE '/Users/|/home/[a-z]|~/(code|Documents|Desktop)' -- src README.md wiki examples; then
            echo "::error::a local path leaked into a public repository"
            exit 1
          fi
          if git grep -nIwE '[A-E][0-9]{1,3}' -- src test wiki; then
            echo "::error::an internal finding identifier leaked out of the working docs — these name private review notes that no reader here can resolve"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Audit and formatting are independent of the runtime matrix.
      - if: matrix.node == 20
        run: npm audit --audit-level=high
      - run: npm ci
      - if: matrix.node == 20
        run: npm run check:format
      - run: npm run check:wiki-anchors
      - run: npm test
      - run: npm run check:circular
      - run: npm run check:examples

      # Also in the release gate, and deliberately here too: the gate answers "may this publish", this
      # answers "does it run on every supported Node". One npm script invoked twice is not the copied
      # rule that drift comes from.
      - run: npm run check:example-runs

      # React Native's bundler is the one consumer environment nothing else here models: metro 0.72
      # predates `package.json#exports` and its minifier predates ES2021, so a package that passes
      # every check above can still fail to bundle. Both halves were found by a real metro build, not
      # by a compiler.
      - if: matrix.node == 20
        run: npm run check:bundler

  # The executable example, the artifact compile at the consumer TypeScript floor, and the React 19
  # suite: see release-gate.yml. Both this workflow and release.yml call it so neither can carry a
  # copy of these steps that drifts from the other's.
  release-gate:
    uses: ./.github/workflows/release-gate.yml
